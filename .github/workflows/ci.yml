name: ci
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Install and run gitleaks ourselves so the first push (and any range
      # whose left side is a root commit) cannot fail on `<root>^..HEAD`.
      # A full-history detect is at least as strong as the action's range scan.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.24.3
          ARCHIVE="gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/${ARCHIVE}" | sha256sum -c
          sudo tar -xzf "/tmp/${ARCHIVE}" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history
        run: |
          set -euo pipefail
          gitleaks detect --source . --verbose --redact --exit-code=1
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build            # ABIs in out/ are read by the agent
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: cd bundler && npm install && npm test
      - run: cd agent && npm install && npm test   # offline; live Gemini tests skip without GEMINI_LIVE
      - run: cd web && npm ci && npm test && npm run build
  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - run: docker compose config --quiet
        env: { BUNDLER_PRIVATE_KEY: "0x00", OWNER_TOKEN: "ci" }
