name: ci
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build            # ABIs in out/ are read by the agent
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: cd bundler && npm install && npm test
      - run: cd agent && npm install && npm test   # offline; live Gemini tests skip without GEMINI_LIVE
      - run: cd web && npm ci && npm test && npm run build
  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - run: docker compose config --quiet
        env: { BUNDLER_PRIVATE_KEY: "0x00", OWNER_TOKEN: "ci" }
